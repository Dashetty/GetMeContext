[project]
name = "getmecontext"
version = "2.0.0"
description = "RAG-powered PDF Q&A with Gemini, ChromaDB, and Streamlit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "chroma_db"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
